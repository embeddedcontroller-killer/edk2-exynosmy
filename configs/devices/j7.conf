# ==============================================================================
# Samsung Galaxy J7 (2015) - Exynos 7580 Configuration
# ==============================================================================

# --- Platform Tanımlamaları ---
SOC_PLATFORM="EXYNOS7580"
VENDOR_NAME="Samsung"
PLATFORM_NAME="j7"

# --- EDK2 Bellek Yapılandırması ---
# Payload'un RAM'de başlayacağı adres (DRAM Base)
FD_BASE=0x80000000
# Firmware Volume boyutu (16MB)
FD_SIZE=0x1000000

# --- mkbootimg Konfigürasyonu ---
# Boot imajının başlık (header) bilgileridir. 
# Cihazın bootloader'ı bu değerleri kontrol ederek imajı kabul eder.
BOOTIMG_OS_PATCH_LEVEL="2024-01"
BOOTIMG_OS_VERSION=11.0.0
BOOTIMG_HEADER_VERSION=0

# --- Ekstra Tanımlar ---
DEVICE_CODE="j700"
SOC_NAME="exynos7580"
