# Exynos 7580 - J7 2015 Memory Configuration

# Payload'un RAM'de başlayacağı adres (DRAM Base)
# Exynos 7580'de DRAM genellikle 0x80000000 adresinden başlar.
FD_BASE=0x80000000

# Firmware Volume (FV) boyutu
# İlk aşamada 16MB (0x1000000) fazlasıyla yeterlidir. 
# İleride sürücüler eklendikçe bunu artırabiliriz.
FD_SIZE=0x1000000
